name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI from clean checkout
        run: python -m pip install .
      - name: Test installed executable
        run: pr-evidence-gate --version
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic receipt smoke test (offline, untrusted)
        run: pr-evidence-gate receipt --manifest examples/receipt-v1/receipt.json
      - name: Doctor is fail-closed without login
        shell: python
        run: |
          import json, subprocess
          result = subprocess.run(["pr-evidence-gate", "doctor"], text=True, capture_output=True)
          data = json.loads(result.stdout)
          assert data["schema"] == "pr-evidence-gate/doctor/v1"
          assert data["public_actions_authorized"] is False
          assert result.returncode in (0, 2)
